name: Terraform Plan

# init + validate + plan run on any change to the repo:
#   - every pull request
#   - every push (any branch)
#   - manual dispatch (plan on demand)
# The environment is chosen by the repo variable TF_ENVIRONMENT (default: dev).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: latest                              # satisfies required_version = "~>1.15"
  AWS_REGION: af-south-1                           # matches the S3 backend region
  TF_ENVIRONMENT: ${{ vars.TF_ENVIRONMENT || 'dev' }}

jobs:
  plan:
    name: plan (${{ vars.TF_ENVIRONMENT || 'dev' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve backend config
        id: cfg
        run: |
          case "$TF_ENVIRONMENT" in
            dev)  DIR=Dev ;;
            int)  DIR=int ;;
            prod) DIR=prod ;;
            *) echo "::error::Unknown TF_ENVIRONMENT '$TF_ENVIRONMENT' (expected dev|int|prod)"; exit 1 ;;
          esac
          echo "backend_config=values/$DIR/$TF_ENVIRONMENT.tfbackend" >> "$GITHUB_OUTPUT"

      # Terraform's S3 backend cannot create its own state bucket, so ensure it
      # exists before init (idempotent — no-op when it is already there).
      - name: Ensure state backend bucket exists
        run: |
          BUCKET=$(sed -nE 's/^[[:space:]]*bucket[[:space:]]*=[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' "${{ steps.cfg.outputs.backend_config }}")
          if [ -z "$BUCKET" ]; then echo "::error::could not parse bucket from backend config"; exit 1; fi
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket '$BUCKET' already exists."
          else
            echo "State bucket '$BUCKET' missing — creating it in $AWS_REGION."
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          fi

      - name: Format check
        continue-on-error: true                    # warns but does not block the plan
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend-config=${{ steps.cfg.outputs.backend_config }}

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        env:
          TF_VAR_environment: ${{ env.TF_ENVIRONMENT }}
        # -lock=false so a plan on a push to main does not fight the apply
        # workflow for the state lock (this is a read-only preview).
        run: terraform plan -no-color -input=false -lock=false -out=tfplan | tee plan.txt

      - name: Publish plan to job summary
        if: always()
        run: |
          {
            echo "### Terraform Plan — ${TF_ENVIRONMENT}"
            echo '```'
            tail -c 60000 plan.txt 2>/dev/null || echo "(no plan output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENVIRONMENT }}
          path: |
            Project/tfplan
            Project/plan.txt
          retention-days: 5
          if-no-files-found: ignore
