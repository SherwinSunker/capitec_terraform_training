name: Terraform Apply

# Runs when changes are pushed to main (and can also be triggered manually).
# Each environment job pauses for manual approval via a GitHub Environment
# protection rule before it applies — configure required reviewers under
# Settings > Environments > (dev|int|prod).
on:
  push:
    branches: [main]
    paths:
      - "Project/**/*.tf"
      - "Project/**/*.tfvars"
      - "Project/**/*.tfbackend"
      - "*.tf"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never let two applies run against the same branch at once.
concurrency:
  group: tf-apply-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: latest          # satisfies required_version = "~>1.15" in Providers.tf
  AWS_REGION: af-south-1

jobs:
  apply:
    name: apply (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The environment name binds this job to that GitHub Environment's
    # protection rules (required reviewers = the manual-approval gate).
    environment: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 1           # apply dev -> int -> prod sequentially, never in parallel
      matrix:
        include:
          - name: dev
            backend_config: values/Dev/dev.tfbackend
          - name: int
            backend_config: values/int/int.tfbackend
          - name: prod
            backend_config: values/prod/prod.tfbackend
    defaults:
      run:
        shell: bash
        working-directory: Project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false -backend-config=${{ matrix.backend_config }}

      - name: Validate
        run: terraform validate -no-color

      - name: Apply
        env:
          TF_VAR_environment: ${{ matrix.name }}
        run: terraform apply -auto-approve -no-color -input=false
