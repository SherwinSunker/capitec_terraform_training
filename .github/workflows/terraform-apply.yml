name: Terraform Apply

# Runs only when changes are pushed to main.
# Applies a single environment, chosen by the repo variable TF_ENVIRONMENT
# (default: dev). The job pauses for manual approval via that GitHub
# Environment's protection rules — configure required reviewers under
# Settings > Environments > (dev|int|prod).
on:
  push:
    branches: [main]
    paths:
      - "Project/**/*.tf"
      - "Project/**/*.tfvars"
      - "Project/**/*.tfbackend"
      - "*.tf"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read

# Never let two applies run against the same branch at once.
concurrency:
  group: tf-apply-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: latest                              # satisfies required_version = "~>1.15"
  AWS_REGION: af-south-1
  TF_ENVIRONMENT: ${{ vars.TF_ENVIRONMENT || 'dev' }}

jobs:
  apply:
    name: apply (${{ vars.TF_ENVIRONMENT || 'dev' }})
    runs-on: ubuntu-latest
    # Bind the job to the selected GitHub Environment so its protection
    # rules (required reviewers) act as the manual-approval gate.
    environment: ${{ vars.TF_ENVIRONMENT || 'dev' }}
    defaults:
      run:
        shell: bash
        working-directory: Project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve backend config
        id: cfg
        run: |
          case "$TF_ENVIRONMENT" in
            dev)  DIR=Dev ;;
            int)  DIR=int ;;
            prod) DIR=prod ;;
            *) echo "::error::Unknown TF_ENVIRONMENT '$TF_ENVIRONMENT' (expected dev|int|prod)"; exit 1 ;;
          esac
          echo "backend_config=values/$DIR/$TF_ENVIRONMENT.tfbackend" >> "$GITHUB_OUTPUT"

      - name: Init
        run: terraform init -input=false -backend-config=${{ steps.cfg.outputs.backend_config }}

      - name: Validate
        run: terraform validate -no-color

      - name: Apply
        env:
          TF_VAR_environment: ${{ env.TF_ENVIRONMENT }}
        run: terraform apply -auto-approve -no-color -input=false
