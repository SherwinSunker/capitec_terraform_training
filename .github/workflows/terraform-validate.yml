name: Terraform Validate

# Dedicated validation workflow — runs on every push and pull request
# (all branches). Validation is configuration-level, so it initialises
# without a backend and needs no AWS credentials.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: latest # satisfies required_version = "~>1.15"

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        continue-on-error: true # warns but does not fail the run
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color
